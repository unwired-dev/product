  electron-to-chromium: 1.5.444

catalog:
  '@effect/tsgo': 0.48.0
  '@changesets/cli': ^3.0.3
  '@convex-dev/eslint-plugin': ^5.0.0
  '@rajzik/oxfmt-config': ^4.0.4
  '@rajzik/oxlint-config': ^4.0.4
  '@rajzik/tsconfig': ^4.0.4
  '@types/node': ^24.19.1
  convex: ^1.46.0
  effect: 4.0.0
  fallow: ^3.31.0
  oxfmt: ^0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  parse5: 8.0.1
  turbo: ^2.11.7
  typescript: 7.0.2
  vitest: ^5.0.3

patchedDependencies:
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@oxfmt/binding-android-arm-eabi@0.71.0'
  - '@oxfmt/binding-android-arm64@0.71.0'
  - '@oxfmt/binding-darwin-arm64@0.71.0'
  - '@oxfmt/binding-darwin-x64@0.71.0'
  - '@oxfmt/binding-freebsd-x64@0.71.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.71.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.71.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.71.0'
  - '@oxfmt/binding-linux-arm64-musl@0.71.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.71.0'
