patchedDependencies:
  '@expo/ui@58.0.28': patches/@expo__ui@58.0.28.patch
  expo-glass-effect@58.0.5: patches/expo-glass-effect@58.0.5.patch
  react-native-keyboard-controller@1.22.7: patches/react-native-keyboard-controller@1.22.7.patch
  react-native-macos@0.81.9: patches/react-native-macos@0.81.9.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch
  react-native-webview@14.0.1: patches/react-native-webview@14.0.1.patch

allowBuilds:
  # Jest 30's file watcher ships prebuilt binaries; its install script only compiles a fallback.
  '@parcel/watcher': false
  esbuild: true

# dependency-cruiser needs the TypeScript compiler API, which TypeScript 7 no longer exposes.
# pnpm cannot resolve catalog: in an external package extension; keep this parser version here.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

