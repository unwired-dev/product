  '@tiptap/extension-blockquote': 3.31.4
  '@tiptap/extension-bold': 3.31.4
  '@tiptap/extension-code': 3.31.4
  '@tiptap/extension-document': 3.31.4
  '@tiptap/extension-heading': 3.31.4
  '@tiptap/extension-italic': 3.31.4
  '@tiptap/extension-list': 3.31.4
  '@tiptap/extension-paragraph': 3.31.4
  '@tiptap/extension-strike': 3.31.4
  '@tiptap/extension-text': 3.31.4
  '@tiptap/extension-underline': 3.31.4
  '@tiptap/extensions': 3.31.4
  '@tiptap/pm': 3.31.4
  'esbuild': 0.28.2
  'happy-dom': 20.14.5
  convex: ^1.46.0
  dependency-cruiser: ^18.5.0
  effect: 4.0.0
  i18next: 26.4.2
  react-i18next: 17.0.15
  fallow: ^3.31.0
  oxfmt: ^0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  parse5: 8.0.1
  postal-mime: ^4.0.5
  turbo: ^2.11.7
  typescript: 7.0.2
  vitest: ^5.0.3

patchedDependencies:
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch

allowBuilds:
  esbuild: true

# dependency-cruiser needs the TypeScript compiler API, which TypeScript 7 no longer exposes.
# pnpm cannot resolve catalog: in an external package extension; keep this parser version here.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

minimumReleaseAgeExclude:
  - '@oxfmt/binding-android-arm-eabi@0.71.0'
  - '@oxfmt/binding-android-arm64@0.71.0'
  - '@oxfmt/binding-darwin-arm64@0.71.0'
  - '@oxfmt/binding-darwin-x64@0.71.0'
  - '@oxfmt/binding-freebsd-x64@0.71.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.71.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.71.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.71.0'
  - '@oxfmt/binding-linux-arm64-musl@0.71.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.71.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.71.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.71.0'
  - '@oxfmt/binding-linux-x64-gnu@0.71.0'
  - '@oxfmt/binding-linux-x64-musl@0.71.0'
  - '@oxfmt/binding-openharmony-arm64@0.71.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.71.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.71.0'
  - '@oxfmt/binding-win32-x64-msvc@0.71.0'
  - oxfmt@0.71.0
  # Exact Expo patches required by `expo install --check` in CI for #605.
  # Include their new transitive patches so the release-age delay cannot block installation.
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  # Exact Expo compatibility patches required by PR #914.
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - '@expo/ui@57.0.23'
  - babel-preset-expo@57.0.15
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo-router@57.0.26
  - expo@57.0.28
  - jest-expo@57.0.6

