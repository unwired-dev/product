name: CodeRabbit bot review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: coderabbit-bot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  request-review:
    name: Request review
    if: >-
      github.event.pull_request.user.login == 'gipity-bot[bot]' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[WIP]') &&
      !contains(github.event.pull_request.title, '[skip review]') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-review')
    # Required to post the CodeRabbit trigger through the pull request's Issues API.
    permissions:
      issues: write # Required to create the pull request conversation comment.
    runs-on: ubuntu-latest
    steps:
      - name: Ask CodeRabbit to review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh api --silent --method POST
          "repos/$GH_REPO/issues/$PR_NUMBER/comments"
          -f body='@coderabbitai review'
