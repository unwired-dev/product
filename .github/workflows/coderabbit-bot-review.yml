name: CodeRabbit bot review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write

jobs:
  request-review:
    name: Request review
    if: >-
      github.event.pull_request.user.login == 'gipity-bot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Ask CodeRabbit to review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr comment "$PR_NUMBER" --body '@coderabbitai review'
