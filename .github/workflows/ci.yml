name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect affected projects
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      apple_matrix: ${{ steps.apple-matrix.outputs.matrix }}
      apple_projects_changed: ${{ steps.apple-matrix.outputs.has-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keep one filter per Apple project. Shared changes select every project
      # configured in the Apple matrix below.
      - name: Detect changed Apple projects
        id: changed-paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            apple_shared:
              - '.github/workflows/ci.yml'
              - '.mise.toml'
              - '.swiftlint.yml'
              - 'scripts/check-apple-lint.zsh'
            unwired_mail:
              - 'apps/unwired-mail/**'

      # Add each Apple project here with the filter that owns its source files.
      - name: Build Apple project matrix
        id: apple-matrix
        env:
          CHANGED_FILTERS: ${{ steps.changed-paths.outputs.changes }}
        run: |
          projects='[
            {
              "filter": "unwired_mail",
              "name": "Unwired Mail",
              "runner": "blacksmith-6vcpu-macos-26",
              "project": "apps/unwired-mail/unwired-mail.xcodeproj",
              "scheme": "unwired-mail",
              "destination": "platform=iOS Simulator,name=iPhone 17"
            }
          ]'

          matrix="$(
            jq -cn \
              --argjson projects "$projects" \
              --argjson changed "$CHANGED_FILTERS" \
              '{
                include: $projects
                  | map(
                      . as $project
                      | select(
                          ($changed | index("apple_shared")) != null
                          or ($changed | index($project.filter)) != null
                        )
                      | del(.filter)
                    )
              }'
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-projects=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

  fallow:
    name: Fallow
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze
        uses: fallow-rs/fallow@v2
        with:
          format: sarif

  apple:
    name: Apple · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple_projects_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Homebrew cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Install Apple lint tools
        run: |
          brew install mise swift-format
          mise trust .mise.toml
          mise install swiftlint

      - name: Swift format and lint
        run: mise exec -- zsh scripts/check-apple-lint.zsh

      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot 'iPhone 17' || true
          xcrun simctl bootstatus 'iPhone 17' -b

      - name: Test
        run: xcodebuild test -project '${{ matrix.project }}' -scheme '${{ matrix.scheme }}' -destination '${{ matrix.destination }}' -parallel-testing-enabled NO
