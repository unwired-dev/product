name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -e -o pipefail {0}

jobs:
  typescript:
    name: TypeScript
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check agent workflow contracts
        run: bash scripts/check-pr-babysitter-contract.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check changesets target workspace packages
        run: node scripts/check-changesets.mjs

      - name: Check changeset validation, release planning and auto-merge contracts
        run: node --test scripts/check-changesets.test.mjs scripts/release.test.mjs scripts/auto-merge.test.mjs

      - name: Install native runner contract shell
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check isolated Mock Mail Session runners
        run: pnpm test:native-runner

      - name: Check Effect import policy
        run: pnpm test:tooling

      - name: Check replacement app and retained backend
        run: >-
          pnpm exec turbo run lint format check-types test
          --filter=//
          --filter=@private-email/mobile...
          --filter=@private-email/macos...
          --filter=@private-email/convex...

  fallow:
    name: Fallow
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze
        uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        with:
          command: audit
          version: 3.31.0
          format: sarif
          gate: new-only
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
