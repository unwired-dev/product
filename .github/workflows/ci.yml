name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -e -o pipefail {0}

jobs:
  changes:
    name: Detect affected projects
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      apple_core_matrix: ${{ steps.apple-matrix.outputs.core-matrix }}
      apple_debug_matrix: ${{ steps.apple-matrix.outputs.debug-matrix }}
      apple_performance_matrix: ${{ steps.apple-matrix.outputs.performance-matrix }}
      apple_required_matrix: ${{ steps.apple-matrix.outputs.required-matrix }}
      apple_core_projects_changed: ${{ steps.apple-matrix.outputs.has-core-projects }}
      apple_debug_projects_changed: ${{ steps.apple-matrix.outputs.has-debug-projects }}
      apple_performance_projects_changed: ${{ steps.apple-matrix.outputs.has-performance-projects }}
      apple_validation_projects_changed: ${{ steps.apple-matrix.outputs.has-required-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep one filter per Apple project. Shared changes select every project
      # configured in the Apple matrix below.
      - name: Detect changed Apple projects
        id: changed-paths
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            apple_shared:
              - '.github/workflows/ci.yml'
              - '.mise.toml'
              - '.swiftlint.yml'
              - 'scripts/check-apple-lint.zsh'
              - 'scripts/measure-ci-command.zsh'
            unwired_mail:
              - 'apps/unwired-mail/**'
            unwired_mail_performance:
              - 'apps/unwired-mail/unwired-mail.xcodeproj/**'
              - 'apps/unwired-mail/unwired-mail/App/**'
              - 'apps/unwired-mail/unwired-mail/Features/Account/**'
              - 'apps/unwired-mail/unwired-mail/Services/**'
              - 'apps/unwired-mail/unwired-mailTests/MailboxConnectionAdapterTests.swift'
            unwired_mail_core_loop:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/mail-test-harness/**'
              - 'apps/unwired-mail/unwired-mail.xcodeproj/**'
              - 'apps/unwired-mail/unwired-mail/App/**'
              - 'apps/unwired-mail/unwired-mail/Features/Account/**'
              - 'apps/unwired-mail/unwired-mail/Services/**'
              - 'apps/unwired-mail/unwired-mailMailTestUITests/**'

      # Each project declares its broad Debug filter plus narrower Release
      # performance and Core Mail Loop filters.
      - name: Build Apple project matrices
        id: apple-matrix
        env:
          CHANGED_FILTERS: ${{ steps.changed-paths.outputs.changes }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          projects='[
            {
              "filter": "unwired_mail",
              "performance_filter": "unwired_mail_performance",
              "core_filter": "unwired_mail_core_loop",
              "name": "Unwired Mail",
              "runner": "macos-26",
              "project": "apps/unwired-mail/unwired-mail.xcodeproj",
              "package_resolved": "apps/unwired-mail/unwired-mail.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved",
              "scheme": "unwired-mail",
              "destination": "platform=iOS Simulator,name=iPhone 17"
            }
          ]'
          changed="$CHANGED_FILTERS"
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            changed="$(
              jq -cn --argjson projects "$projects" \
                '$projects | map(.performance_filter, .core_filter)'
            )"
          fi

          matrices="$(
            jq -cn \
              --argjson projects "$projects" \
              --argjson changed "$changed" '
                def selected($project; $filter):
                  ($changed | index("apple_shared")) != null
                  or ($changed | index($project[$filter])) != null;
                def base: del(.filter, .performance_filter, .core_filter);
                {
                  debug: {
                    include: $projects
                      | map(. as $project | select(selected($project; "filter")) | base)
                  },
                  performance: {
                    include: $projects
                      | map(. as $project | select(selected($project; "performance_filter")) | base)
                  },
                  core: {
                    include: $projects
                      | map(. as $project | select(selected($project; "core_filter")) | base)
                  },
                  required: {
                    include: $projects
                      | map(
                          . as $project
                          | selected($project; "filter") as $debug
                          | selected($project; "performance_filter") as $performance
                          | selected($project; "core_filter") as $core
                          | select($debug or $performance or $core)
                          | (base + {
                              requires_debug: $debug,
                              requires_performance: $performance,
                              requires_core: $core
                            })
                        )
                  }
                }
              '
          )"

          debug_matrix="$(jq -c '.debug' <<< "$matrices")"
          performance_matrix="$(jq -c '.performance' <<< "$matrices")"
          core_matrix="$(jq -c '.core' <<< "$matrices")"
          required_matrix="$(jq -c '.required' <<< "$matrices")"
          echo "debug-matrix=$debug_matrix" >> "$GITHUB_OUTPUT"
          echo "performance-matrix=$performance_matrix" >> "$GITHUB_OUTPUT"
          echo "core-matrix=$core_matrix" >> "$GITHUB_OUTPUT"
          echo "required-matrix=$required_matrix" >> "$GITHUB_OUTPUT"
          echo "has-debug-projects=$(jq -r '.include | length > 0' <<< "$debug_matrix")" >> "$GITHUB_OUTPUT"
          echo "has-performance-projects=$(jq -r '.include | length > 0' <<< "$performance_matrix")" >> "$GITHUB_OUTPUT"
          echo "has-core-projects=$(jq -r '.include | length > 0' <<< "$core_matrix")" >> "$GITHUB_OUTPUT"
          echo "has-required-projects=$(jq -r '.include | length > 0' <<< "$required_matrix")" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check agent workflow contracts
        run: bash scripts/check-pr-babysitter-contract.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Check types
        run: pnpm turbo run check-types

      - name: Test
        run: pnpm test

  fallow:
    name: Fallow
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze
        uses: fallow-rs/fallow@3cf8074a0e2e91c895c0a4224ba1c3bec4630d65 # v3.14.0
        with:
          command: audit
          version: 3.9.1
          format: sarif
          gate: new-only
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  apple_debug:
    name: Apple Debug · ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.apple_debug_projects_changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_debug_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/SourcePackages
          key: apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ hashFiles(matrix.package_resolved) }}
          restore-keys: |
            apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Restore Xcode DerivedData cache
        id: derived-data-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/DerivedData
          key: apple-derived-data-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ github.sha }}
          restore-keys: |
            apple-derived-data-debug-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Install Apple lint tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zsh scripts/measure-ci-command.zsh setup .ci-metrics/apple-debug.tsv -- zsh -c '
            set -e
            brew untap aws/tap 2>/dev/null || true
            brew install mise swift-format
            mise trust .mise.toml
            mise install swiftlint
            mise bin-paths swiftlint >> "$GITHUB_PATH"
          '

      - name: Swift format and lint
        run: zsh scripts/check-apple-lint.zsh

      - name: Boot iPhone simulator
        run: |
          zsh scripts/measure-ci-command.zsh simulator .ci-metrics/apple-debug.tsv -- zsh -c '
            xcrun simctl boot "iPhone 17" || true
            xcrun simctl bootstatus "iPhone 17" -b
          '

      - name: Build tests
        run: |
          zsh scripts/measure-ci-command.zsh build .ci-metrics/apple-debug.tsv -- \
            xcodebuild build-for-testing \
              -project '${{ matrix.project }}' \
              -scheme '${{ matrix.scheme }}' \
              -destination '${{ matrix.destination }}' \
              -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
              -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
              -parallel-testing-enabled NO

      - name: Save Xcode DerivedData cache
        if: steps.derived-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/DerivedData
          key: ${{ steps.derived-data-cache.outputs.cache-primary-key }}

      - name: Test
        run: |
          zsh scripts/measure-ci-command.zsh test .ci-metrics/apple-debug.tsv -- \
            xcodebuild test-without-building \
              -project '${{ matrix.project }}' \
              -scheme '${{ matrix.scheme }}' \
              -destination '${{ matrix.destination }}' \
              -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
              -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
              -parallel-testing-enabled NO \
              '-skip-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseMixedConnectionScenario()' \
              '-skip-testing:unwired-mailTests/MailboxConnectionAdapterTests/testProviderRolloutMixedConnectionScenario()' \
              '-skip-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseCachedPresentationMeetsPerformanceBudgets()'

      - name: Test mixed-connection scenarios
        run: |
          zsh scripts/measure-ci-command.zsh mixed-connection .ci-metrics/apple-debug.tsv -- \
            xcodebuild test-without-building \
              -project '${{ matrix.project }}' \
              -scheme '${{ matrix.scheme }}' \
              -destination '${{ matrix.destination }}' \
              -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
              -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
              -parallel-testing-enabled NO \
              '-only-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseMixedConnectionScenario()' \
              '-only-testing:unwired-mailTests/MailboxConnectionAdapterTests/testProviderRolloutMixedConnectionScenario()'

      - name: Upload Apple Debug measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-debug-metrics-${{ matrix.scheme }}-${{ github.run_id }}
          path: .ci-metrics/apple-debug.tsv
          if-no-files-found: warn
          retention-days: 30

  apple_performance:
    name: Apple performance · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple_performance_projects_changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_performance_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Xcode version
        id: xcode-version
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/SourcePackages
          key: apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ hashFiles(matrix.package_resolved) }}
          restore-keys: |
            apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Restore Xcode DerivedData cache
        id: derived-data-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/DerivedData
          key: apple-derived-data-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ github.sha }}
          restore-keys: |
            apple-derived-data-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Boot iPhone simulator
        run: |
          zsh scripts/measure-ci-command.zsh simulator .ci-metrics/apple-performance.tsv -- zsh -c '
            xcrun simctl boot "iPhone 17" || true
            xcrun simctl bootstatus "iPhone 17" -b
          '

      - name: Build Release performance fixture
        run: |
          zsh scripts/measure-ci-command.zsh build .ci-metrics/apple-performance.tsv -- \
            xcodebuild build-for-testing \
              -project '${{ matrix.project }}' \
              -scheme '${{ matrix.scheme }}' \
              -configuration Release \
              ENABLE_TESTABILITY=YES \
              ONLY_ACTIVE_ARCH=YES \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS='TESTING CI_PERFORMANCE_BUDGET' \
              -destination '${{ matrix.destination }}' \
              -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
              -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
              -parallel-testing-enabled NO

      - name: Save Xcode DerivedData cache
        if: steps.derived-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xcode-cache/${{ matrix.scheme }}/DerivedData
          key: ${{ steps.derived-data-cache.outputs.cache-primary-key }}

      - name: Test Release performance budget
        run: |
          zsh scripts/measure-ci-command.zsh test .ci-metrics/apple-performance.tsv -- \
            xcodebuild test-without-building \
              -project '${{ matrix.project }}' \
              -scheme '${{ matrix.scheme }}' \
              -configuration Release \
              ENABLE_TESTABILITY=YES \
              ONLY_ACTIVE_ARCH=YES \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS='TESTING CI_PERFORMANCE_BUDGET' \
              -destination '${{ matrix.destination }}' \
              -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
              -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
              -parallel-testing-enabled NO \
              '-only-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseCachedPresentationMeetsPerformanceBudgets()'

      - name: Upload Apple performance measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-performance-metrics-${{ matrix.scheme }}-${{ github.run_id }}
          path: .ci-metrics/apple-performance.tsv
          if-no-files-found: warn
          retention-days: 30

  apple_core_mail_loop:
    name: Apple Core Mail Loop · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple_core_projects_changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_core_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Homebrew cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Restore GreenMail cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unwired-mail-test/artifacts
          key: greenmail-${{ runner.os }}-${{ hashFiles('packages/mail-test-harness/src/artifact.ts') }}

      - name: Install dependencies and Java
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          zsh scripts/measure-ci-command.zsh setup .ci-metrics/core-mail-loop.tsv -- zsh -c '
            set -e
            pnpm install --frozen-lockfile
            brew untap aws/tap 2>/dev/null || true
            brew install mise
            mise trust .mise.toml
            mise install
          '

      - name: Run Core Mail Loop
        id: core-mail-loop
        continue-on-error: true
        run: |
          mkdir -p artifacts/core-mail-loop
          zsh scripts/measure-ci-command.zsh test .ci-metrics/core-mail-loop.tsv -- \
            pnpm mail:test run core-mail-loop --json \
              --result-bundle-directory '${{ github.workspace }}/artifacts/core-mail-loop/results' \
              > artifacts/core-mail-loop/evidence.json \
              2> artifacts/core-mail-loop/diagnostics.log

      - name: Inspect cleanup state after a Core Mail Loop failure
        if: steps.core-mail-loop.outcome == 'failure'
        run: |
          pnpm mail:test doctor \
            > artifacts/core-mail-loop/doctor.json \
            2>> artifacts/core-mail-loop/diagnostics.log || true

      - name: Upload Core Mail Loop failure evidence
        if: steps.core-mail-loop.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-mail-loop-failure-${{ matrix.scheme }}-${{ github.run_id }}
          path: artifacts/core-mail-loop
          if-no-files-found: error
          retention-days: 14

      - name: Upload Core Mail Loop measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-mail-loop-metrics-${{ matrix.scheme }}-${{ github.run_id }}
          path: .ci-metrics/core-mail-loop.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Require Core Mail Loop to pass
        if: '!cancelled()'
        env:
          CORE_MAIL_LOOP_OUTCOME: ${{ steps.core-mail-loop.outcome }}
        run: test "$CORE_MAIL_LOOP_OUTCOME" = success

  apple:
    name: Apple · ${{ matrix.name }}
    needs:
      - changes
      - apple_debug
      - apple_performance
      - apple_core_mail_loop
    if: always() && needs.changes.outputs.apple_validation_projects_changed == 'true'
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_required_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected Apple validation
        env:
          CORE_REQUIRED: ${{ matrix.requires_core }}
          CORE_RESULT: ${{ needs.apple_core_mail_loop.result }}
          DEBUG_REQUIRED: ${{ matrix.requires_debug }}
          DEBUG_RESULT: ${{ needs.apple_debug.result }}
          PERFORMANCE_REQUIRED: ${{ matrix.requires_performance }}
          PERFORMANCE_RESULT: ${{ needs.apple_performance.result }}
        run: |
          if [[ "$DEBUG_REQUIRED" == 'true' ]]; then
            [[ "$DEBUG_RESULT" == 'success' ]]
          fi
          if [[ "$PERFORMANCE_REQUIRED" == 'true' ]]; then
            [[ "$PERFORMANCE_RESULT" == 'success' ]]
          fi
          if [[ "$CORE_REQUIRED" == 'true' ]]; then
            [[ "$CORE_RESULT" == 'success' ]]
          fi
