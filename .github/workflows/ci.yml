name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect affected projects
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      apple_matrix: ${{ steps.apple-matrix.outputs.matrix }}
      apple_projects_changed: ${{ steps.apple-matrix.outputs.has-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep one filter per Apple project. Shared changes select every project
      # configured in the Apple matrix below.
      - name: Detect changed Apple projects
        id: changed-paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            apple_shared:
              - '.github/workflows/ci.yml'
              - '.mise.toml'
              - '.swiftlint.yml'
              - 'scripts/check-apple-lint.zsh'
            unwired_mail:
              - 'apps/unwired-mail/**'

      # Add each Apple project here with the filter that owns its source files.
      - name: Build Apple project matrix
        id: apple-matrix
        env:
          CHANGED_FILTERS: ${{ steps.changed-paths.outputs.changes }}
        run: |
          projects='[
            {
              "filter": "unwired_mail",
              "name": "Unwired Mail",
              "runner": "macos-26",
              "project": "apps/unwired-mail/unwired-mail.xcodeproj",
              "package_resolved": "apps/unwired-mail/unwired-mail.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved",
              "scheme": "unwired-mail",
              "destination": "platform=iOS Simulator,name=iPhone 17"
            }
          ]'

          matrix="$(
            jq -cn \
              --argjson projects "$projects" \
              --argjson changed "$CHANGED_FILTERS" \
              '{
                include: $projects
                  | map(
                      . as $project
                      | select(
                          ($changed | index("apple_shared")) != null
                          or ($changed | index($project.filter)) != null
                        )
                      | del(.filter)
                    )
              }'
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-projects=$(jq -r '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

  fallow:
    name: Fallow
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Analyze
        uses: fallow-rs/fallow@3cf8074a0e2e91c895c0a4224ba1c3bec4630d65 # v3.14.0
        with:
          command: audit
          version: 3.9.1
          format: sarif
          gate: new-only
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  apple:
    name: Apple · ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple_projects_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.apple_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Xcode version
        id: xcode-version
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Restore Swift package cache
        uses: actions/cache@v6
        with:
          path: .xcode-cache/${{ matrix.scheme }}/SourcePackages
          key: apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ hashFiles(matrix.package_resolved) }}
          restore-keys: |
            apple-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Restore Xcode DerivedData cache
        uses: actions/cache@v6
        with:
          path: .xcode-cache/${{ matrix.scheme }}/DerivedData
          key: apple-derived-data-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-${{ github.sha }}
          restore-keys: |
            apple-derived-data-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.key }}-${{ matrix.scheme }}-

      - name: Install Apple lint tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew install mise swift-format
          mise trust .mise.toml
          mise install swiftlint
          mise bin-paths swiftlint >> "$GITHUB_PATH"

      - name: Swift format and lint
        run: zsh scripts/check-apple-lint.zsh

      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot 'iPhone 17' || true
          xcrun simctl bootstatus 'iPhone 17' -b

      - name: Test
        run: |
          xcodebuild test \
            -project '${{ matrix.project }}' \
            -scheme '${{ matrix.scheme }}' \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
            -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
            -parallel-testing-enabled NO \
            -skip-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseCachedPresentationMeetsPerformanceBudgets

      - name: Test Release performance budget
        run: |
          xcodebuild test \
            -project '${{ matrix.project }}' \
            -scheme '${{ matrix.scheme }}' \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='TESTING CI_PERFORMANCE_BUDGET' \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '.xcode-cache/${{ matrix.scheme }}/DerivedData' \
            -clonedSourcePackagesDirPath '.xcode-cache/${{ matrix.scheme }}/SourcePackages' \
            -parallel-testing-enabled NO \
            -only-testing:unwired-mailTests/MailboxConnectionAdapterTests/testGmailFirstReleaseCachedPresentationMeetsPerformanceBudgets
