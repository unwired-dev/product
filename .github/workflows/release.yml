name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Version pull request or release tag
    runs-on: ubuntu-24.04
    environment:
      # Holds the personal token; its branch policy admits only main.
      name: main-token
      deployment: false
    timeout-minutes: 10
    outputs:
      release: ${{ steps.changesets.outputs.published }}
      tag: v${{ fromJSON(steps.changesets.outputs.published-packages)[0].version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check changesets and let empty ones wait for the next version
        run: node scripts/check-changesets.mjs --drop-empty
      - name: Open the version pull request or tag the release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bash scripts/release-version.sh
          publish-script: bash scripts/release-tag.sh
          commit-message: Version packages
          pr-title: Version packages
          # The next step creates the GitHub Release; the action pushes only the tag.
          create-github-releases: false
          # A personal token, so CI runs on the version pull request and its merge.
          github-token: ${{ secrets.GH_TOKEN }}
      - name: Create the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: bash scripts/release-github.sh "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: v${{ fromJSON(steps.changesets.outputs.published-packages)[0].version }}

  testflight:
    name: TestFlight
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      platform: both
      ref: ${{ needs.plan.outputs.tag }}
    # Named deploy-key mapping is resolved by the convex-production environment.
    # Hermes and dSYM upload reads POSTHOG_CLI_* from the testflight environment
    # inside the called workflow. Those values are not workflow_call secrets.
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_PUBSUB_TOPIC: ${{ secrets.GMAIL_PUBSUB_TOPIC }}
      MICROSOFT_GRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_GRAPH_CLIENT_ID }}
