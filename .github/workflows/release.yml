name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Version pull request or release tag
    runs-on: ubuntu-24.04
    environment:
      # Holds the personal token; its branch policy admits only main.
      name: main-token
      deployment: false
    timeout-minutes: 10
    outputs:
      release: ${{ steps.changesets.outputs.published }}
      tag: v${{ fromJSON(steps.changesets.outputs.published-packages)[0].version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check changesets and let empty ones wait for the next version
        run: node scripts/check-changesets.mjs --drop-empty
      - name: Open the version pull request or tag the release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bash scripts/release-version.sh
          publish-script: bash scripts/release-tag.sh
          commit-message: Version packages
          pr-title: Version packages
          # A personal token, so CI runs on the version pull request and its merge.
          github-token: ${{ secrets.GH_TOKEN }}

  testflight:
    name: TestFlight
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/testflight.yml
    with:
      platform: both
      ref: ${{ needs.plan.outputs.tag }}
    # Only the hosts' public backend configuration; never the personal token.
    secrets:
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
