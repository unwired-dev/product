name: Convex

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CONVEX_DEPLOY_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    # Holds CONVEX_DEPLOY_KEY; its branch policy admits only main.
    environment: convex-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Deploy functions, schema and auth configuration
        working-directory: packages/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy
