name: Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: Blacksmith Testbox session ID
        required: true

concurrency:
  group: blacksmith-testbox-${{ inputs.testbox_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache/restore@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-typescript-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typescript-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose Node toolchain to Testbox shells
        run: |
          for tool in node npm npx corepack pnpm; do
            sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/$tool"
          done

      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
