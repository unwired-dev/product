name: Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: Blacksmith Testbox session ID
        required: true

concurrency:
  group: blacksmith-testbox-${{ inputs.testbox_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-typescript-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typescript-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose Node toolchain to Testbox shells
        run: |
          for tool in node npm npx corepack pnpm; do
            sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/$tool"
          done

      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
