name: Auto-merge

on:
  # GitHub drops most runs of frequent schedules, so finished check workflows also start a run.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: [CI, Mac, Mobile]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report decisions without dismissing reviews or merging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge cleared pull requests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      # Holds the personal token; its branch policy admits only main.
      name: main-token
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge pull requests cleared by Codex and CodeRabbit
        env:
          # A personal token, so the merge push runs the main-branch workflows.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash scripts/auto-merge.sh
