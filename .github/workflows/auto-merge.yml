name: Auto-merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report decisions without dismissing reviews or merging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge cleared pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Merge pull requests cleared by Codex and CodeRabbit
        env:
          # A personal token, so the merge push runs the main-branch workflows.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: bash scripts/auto-merge.sh
