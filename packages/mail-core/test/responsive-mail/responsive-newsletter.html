<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <style>
      <!--
      @media only screen and (max-width: 620px) {
        table.container { width: 100% !important; }
        .content { padding: 16px !important; }
        h1 { font-size: 24px !important; line-height: 30px !important; }
        .column { width: 50% !important; }
      }
      @media only screen and (max-width: 400px) {
        .content { padding: 12px !important; }
        .lead { font-size: 15px !important; }
      }
      -->
    </style>
  </head>
  <body style="margin: 0; padding: 0">
    <table
      class="container"
      width="600"
      cellpadding="0"
      cellspacing="0"
      border="0"
      align="center"
      style="width: 600px">
      <tr>
        <td
          class="content"
          style="padding: 40px 48px; font-family: Helvetica, Arial, sans-serif">
          <h1 style="margin: 0 0 16px 0; font-size: 34px; line-height: 40px">
            This week in the garden
          </h1>
          <p
            class="lead"
            style="margin: 0 0 16px 0; font-size: 18px; line-height: 26px">
            Three jobs for the weekend, and what to plant before the first
            frost.
          </p>
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0">
            <tr>
              <td
                class="column"
                width="280"
                style="
                  width: 280px;
                  padding: 0 8px 0 0;
                  vertical-align: top;
                  font-size: 15px;
                  line-height: 22px;
                ">
                Divide perennials that flowered poorly this summer.
              </td>
              <td
                class="column"
                width="280"
                style="
                  width: 280px;
                  padding: 0 0 0 8px;
                  vertical-align: top;
                  font-size: 15px;
                  line-height: 22px;
                ">
                Plant garlic cloves 5&nbsp;cm deep, pointed end up.
              </td>
            </tr>
          </table>
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="margin-top: 24px">
            <tr>
              <td
                bgcolor="#1f6f43"
                style="padding: 12px 28px; border-radius: 4px">
                <a
                  href="https://garden.example.com/guide"
                  style="
                    font-size: 16px;
                    font-weight: bold;
                    text-decoration: none;
                    color: #ffffff;
                  "
                  >Read the full guide</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
